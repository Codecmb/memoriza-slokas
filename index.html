<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Memoriza Slokas</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
button,select,input{font:inherit}
.top{
 display:flex;align-items:center;gap:8px;padding:10px;
 background:#eee;border-bottom:1px solid #bbb
}
.top input{width:280px;padding:7px}
.top select{padding:7px}
.count{margin-left:auto}

.layout{
 display:grid;grid-template-columns:310px 1fr;
 height:calc(100vh - 58px);gap:0
}
.sidebar{
 border-right:1px solid #aaa;background:white;
 overflow:auto
}
.verse-item{
 padding:9px 10px;border-bottom:1px solid #ddd;
 cursor:pointer;font-size:14px
}
.verse-item.active{background:#dce8f7}
.verse-item:hover{background:#eee}

.content{
 overflow:auto;padding:15px 20px 30px
}
.heading{
 display:flex;justify-content:space-between;
 font-weight:bold;margin-bottom:10px
}
.source{font-size:20px}
.separator{border:0;border-top:1px solid #bbb;margin:10px 0 14px}

.label{font-weight:bold;margin:12px 0 5px}
.textbox{
 background:white;border:1px solid #aaa;
 padding:14px;white-space:pre-wrap;overflow:auto
}
#verse{font-size:22px;line-height:1.55;min-height:160px}
#translation{font-size:16px;line-height:1.5;min-height:110px}

.audio-status{margin:15px 0 7px;font-size:14px}

.row{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:5px;margin-bottom:8px
}
button{
 padding:10px 8px;border:1px solid #aaa;
 background:#fafafa;border-radius:4px;cursor:pointer
}
button:active{background:#ddd}

.group{
 border:1px solid #aaa;border-radius:5px;
 padding:10px;margin-top:9px
}
.legend{
 font-size:13px;font-weight:bold;
 background:#f4f4f4;padding:0 5px;
 position:relative;top:-19px;display:inline-block
}
.group-content{margin-top:-10px}

.rec-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}

.mem-row{
 display:flex;align-items:center;gap:7px;
 flex-wrap:wrap
}
.mem-row select,.mem-row input{padding:7px}
#pause{width:65px}

.hidden{display:none!important}

@media(max-width:750px){
 .top{flex-wrap:wrap}
 .top label{display:none}
 .top input{width:calc(100% - 105px);flex:1}
 .count{margin-left:0;font-size:13px}
 .layout{display:block;height:auto}
 .sidebar{
   height:220px;border-right:0;
   border-bottom:2px solid #888
 }
 .content{padding:14px}
 .heading{font-size:14px}
 .source{font-size:17px}
.verse-item.needs-fix{background:#fff3b0;border-left:5px solid #d39e00}
.verse-item.fixed-local{background:#dbeafe;border-left:5px solid #2563eb}
.verse-item.active.needs-fix,.verse-item.active.fixed-local{outline:2px solid currentColor}
#reviewStateBtn.needs-fix{background:#fff3b0}
#reviewStateBtn.fixed-local{background:#dbeafe}
 #verse{font-size:19px;min-height:130px}
 .row{grid-template-columns:1fr 1fr}
 .mem-row{align-items:flex-start}
}

@media(display-mode:standalone){
 body{padding-top:env(safe-area-inset-top)}
}
</style>
</head>

<button id="deleteRecording">🗑 Borrar grabación</button>

<script>

let audioMap={};
let filtered=[];
let currentRank=null;

let mediaRecorder=null;
let recordingChunks=[];
let recordingStream=null;

let memorizing=false;
let memorizeRemaining=0;
let memorizePause=1500;

const audio=document.getElementById("audio");
const $=x=>document.getElementById(x);

const DBNAME="MemorizaSlokasDB";
const STORE="recordings";
const EDITSTORE="verseEdits";

const translations={
 en:{

   other:"Other",

   next:"Next ⏭",

   repeat:"Repeat",
   pause:"Pause",

   memorize:"▶ Memorize",
   status:"Status",
   newStatus:"New",
   learningStatus:"Learning",
   memorizedStatus:"Memorized",

   source:"Fuente:",
   all:"Todos",
   other:"Otros",
   wordForWord:"PALABRA POR PALABRA",
   noWordForWord:"La fuente no proporciona glosario palabra por palabra para este verso.",
   translation:"TRADUCCIÓN",
   previous:"⏮ Anterior",
   play:"▶ Reproducir",
   stop:"■ Parar",
   next:"Siguiente ⏭",
   myRecording:"Mi grabación",
   recordVoice:"🎙 Grabar mi voz",
   deleteRecording:"🗑 Borrar grabación",
   memorization:"Memorización",
   repeat:"Repetir",
   pause:"Pausa",
   speed:"Velocidad",
   memorize:"▶ Memorizar",
   status:"Estado",
   newStatus:"Nuevo",
   learningStatus:"Aprendiendo",
   memorizedStatus:"Memorizado",
   verses:"versos",
   pendingText:"Texto pendiente de verificar.",

   recordFirst:"Graba primero este verso."

let currentLanguage=localStorage.getItem("language")||"en";

function setLanguage(lang){
 currentLanguage=lang==="es"?"es":"en";
 localStorage.setItem("language",currentLanguage);

 const t=translations[currentLanguage];

 $("language").value=currentLanguage;
 $("searchLabel").textContent=t.search;
 $("search").placeholder=t.searchPlaceholder;
 $("sourceLabel").textContent=t.source;

 const filterOptions=$("filter").options;
 filterOptions[0].textContent=t.all;
 filterOptions[5].textContent=t.other;

 $("wordForWordLabel").textContent=t.wordForWord;
 $("translationLabel").textContent=t.translation;
 $("prev").textContent=t.previous;
 $("play").textContent=t.play;
 $("stop").textContent=t.stop;
 $("next").textContent=t.next;
 $("recordingLabel").textContent=t.myRecording;
 $("record").textContent=t.recordVoice;
 $("deleteRecording").textContent=t.deleteRecording;
 $("memorizationLabel").textContent=t.memorization;
 $("repeatLabel").textContent=t.repeat;
 $("pauseLabel").textContent=t.pause;
 $("speedLabel").textContent=t.speed;
 $("memorize").textContent=t.memorize;
 $("statusLabel").textContent=t.status;

 const statusOptions=$("status").options;
 statusOptions[0].textContent=t.newStatus;
 statusOptions[1].textContent=t.learningStatus;
 statusOptions[2].textContent=t.memorizedStatus;
}


function openDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open(DBNAME,2);
   req.onupgradeneeded=()=>{
     if(!req.result.objectStoreNames.contains(STORE))
       req.result.createObjectStore(STORE);
     if(!req.result.objectStoreNames.contains(EDITSTORE))
       req.result.createObjectStore(EDITSTORE);
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
 });
}

async function getRecording(rank){
 const db=await openDB();
 return new Promise(resolve=>{
   const tx=db.transaction(STORE,"readonly");
   const req=tx.objectStore(STORE).get(String(rank));
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>resolve(null);
 });
}

async function saveRecording(rank,blob){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(STORE,"readwrite");
   tx.objectStore(STORE).put(blob,String(rank));
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
 });
}

async function removeRecording(rank){
 const db=await openDB();
 return new Promise(resolve=>{
   const tx=db.transaction(STORE,"readwrite");
   tx.objectStore(STORE).delete(String(rank));
   tx.oncomplete=resolve;
 });
}

async function getVerseEdit(rank){
 const db=await openDB();
 return new Promise(resolve=>{
   const tx=db.transaction(EDITSTORE,"readonly");
   const req=tx.objectStore(EDITSTORE).get(String(rank));
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>resolve(null);
 });
}

async function saveVerseEdit(rank,data){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(EDITSTORE,"readwrite");
   tx.objectStore(EDITSTORE).put(data,String(rank));
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
 });
}

async function removeVerseEdit(rank){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction(EDITSTORE,"readwrite");
   tx.objectStore(EDITSTORE).delete(String(rank));
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
 });
}

async function getAllVerseEdits(){
 const db=await openDB();
 return new Promise(resolve=>{
   const tx=db.transaction(EDITSTORE,"readonly");
   const store=tx.objectStore(EDITSTORE);
   const result={};
   const req=store.openCursor();

   req.onsuccess=e=>{
     const cursor=e.target.result;
     if(cursor){
       result[cursor.key]=cursor.value;
       cursor.continue();
     }else{
       resolve(result);
     }
   };

   req.onerror=()=>resolve({});
 });
}

async function importVerseEdits(data){
 const db=await openDB();

 return new Promise((resolve,reject)=>{
   const tx=db.transaction(EDITSTORE,"readwrite");
   const store=tx.objectStore(EDITSTORE);

   for(const [rank,value] of Object.entries(data)){
     if(value && typeof value==="object")
       store.put(value,String(rank));
   }

   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
 });
}

function automaticVerseUrl(source){
 const s=(source||"").trim();
 const lang=currentLanguage==="es" ? "es" : "en";

 // Bhagavad-gita: Bg 2.13
 let m=s.match(/^Bg\s+(\d+)\.(\d+)$/i);
 if(m)
   return "https://vedabase.io/"+lang+"/library/bg/"+m[1]+"/"+m[2]+"/";

 // Srimad-Bhagavatam: SB 1.2.6
 m=s.match(/^SB\s+(\d+)\.(\d+)\.(\d+)$/i);
 if(m)
   return "https://vedabase.io/"+lang+"/library/sb/"+m[1]+"/"+m[2]+"/"+m[3]+"/";

 // Brahma-samhita: Bs 5.1 / BSM 5.1
 m=s.match(/^(?:Bs|BSM)\s+(\d+)\.(\d+)$/i);
 if(m)
   return "https://vedabase.io/"+lang+"/library/bs/"+m[1]+"/"+m[2]+"/";

 // Caitanya-caritamrta:
 // CC Adi 1.1 / CC Madhya 8.128 / CC Antya 20.12
 m=s.match(/^CC\s+(Adi|Madhya|Antya)\s+(\d+)\.(\d+)$/i);
 if(m)
   return "https://vedabase.io/"+lang+"/library/cc/"+
     m[1].toLowerCase()+"/"+m[2]+"/"+m[3]+"/";

 return "";
}

function category(source){
 const s=(source||"").toLowerCase();
 if(s.startsWith("bg ")) return "Bhagavad-gita";
 if(s.startsWith("sb ")) return "Srimad-Bhagavatam";
 if(s.startsWith("cc ")) return "Caitanya-caritamrta";
 if(s.startsWith("bsm ")) return "Brahma-samhita";
 return "Otros";
}

function current(){
 return verses.find(v=>v.rank===currentRank);
}


function reviewKey(rank){ return "review_state_"+rank; }
function getReviewState(rank){ return localStorage.getItem(reviewKey(rank))||""; }
function setReviewState(rank,state){
 if(state) localStorage.setItem(reviewKey(rank),state);
 else localStorage.removeItem(reviewKey(rank));
}
function updateReviewButton(){
 const b=$("reviewStateBtn");
 if(!b || currentRank===null)return;
 const st=getReviewState(currentRank);
 b.classList.remove("needs-fix","fixed-local");
 if(st==="needs-fix"){
   b.textContent=currentLanguage==="es"?"🟡 Por corregir":"🟡 Needs correction";
   b.classList.add("needs-fix");
 }else if(st==="fixed-local"){
   b.textContent=currentLanguage==="es"?"🔵 Corregido localmente":"🔵 Corrected locally";
   b.classList.add("fixed-local");
 }else{
   b.textContent=currentLanguage==="es"?"⚑ Marcar para corregir":"⚑ Mark for correction";
 }
}

async function applyFilter(){
 const q=$("search").value.toLowerCase().trim();
 const f=$("filter").value;

 const edits=await getAllVerseEdits();

 filtered=verses.filter(original=>{
   const edit=edits[String(original.rank)];
   const v=edit ? {...original,...edit} : original;

   const reviewState=getReviewState(v.rank);
   const matchesSource=
     f==="missing-es" ? !(v.translation_es||"").trim()
     : f==="needs-fix" ? reviewState==="needs-fix"
     : f==="fixed-local" ? reviewState==="fixed-local"
     : (f==="all" || category(v.source)===f);

   const searchable=[
     v.rank,
     v.source,
     v.opening,
     v.verse,
     v.translation,
     v.translation_es
   ]
   .map(x=>String(x||"").toLowerCase())
   .join(" ");

   const matchesSearch=!q || searchable.includes(q);

   return matchesSource && matchesSearch;
 });

 $("count").textContent=
   filtered.length+" "+translations[currentLanguage].verses;

 await renderList();

 if(filtered.length && !filtered.some(v=>v.rank===currentRank))
   await selectVerse(filtered[0].rank);
}

async function renderList(){
 const list=$("list");
 list.innerHTML="";

 const edits=await getAllVerseEdits();

 filtered.forEach(original=>{
   const edit=edits[String(original.rank)];
   const v=edit ? {...original,...edit} : original;

   const d=document.createElement("div");
   const reviewState=getReviewState(v.rank);
   d.className="verse-item"+(v.rank===currentRank?" active":"")+
     (reviewState==="needs-fix"?" needs-fix":reviewState==="fixed-local"?" fixed-local":"");

   const spanishDone=!!(v.translation_es||"").trim();

   d.textContent=
     (reviewState==="needs-fix" ? "🟡 " : reviewState==="fixed-local" ? "🔵 " : "")+
     (!spanishDone ? "🔴 " : "")+
     (edit ? "✏️ " : "")+
     "#"+String(v.rank).padStart(3,"0")+"  "+
     (v.source||"")+" — "+(v.opening||"");

   d.onclick=()=>selectVerse(v.rank);
   d.dataset.rank=v.rank;
   list.appendChild(d);
 });
}

async function selectVerse(rank){
 if(currentRank!==null && rank!==currentRank && editorHasUnsavedChanges()){
   const msg=currentLanguage==="es"
     ? "Hay cambios sin guardar. ¿Cambiar de verso y descartarlos?"
     : "There are unsaved changes. Change verse and discard them?";

   if(!confirm(msg))return;
 }

 stopEverything();

 currentRank=rank;
 updateReviewButton();
 const original=current();
 if(!original)return;

 const edit=await getVerseEdit(rank);
 const v=edit ? {...original,...edit} : original;

 localStorage.setItem("last_rank",rank);

 $("rank").textContent="# "+v.rank+
   (currentLanguage==="es"?" de ":" of ")+verses.length;
 $("source").textContent=v.source||"";

 const originalUrl=v.original_url || automaticVerseUrl(v.source);

 if(originalUrl){
   $("source").href=originalUrl;
   $("source").style.pointerEvents="";
   $("source").style.textDecoration="underline";
   $("source").title=currentLanguage==="es"
     ? "Abrir verso original"
     : "Open original verse";
 }else{
   $("source").removeAttribute("href");
   $("source").style.pointerEvents="none";
   $("source").style.textDecoration="none";
   $("source").title="";
 }

 $("verse").textContent=v.verse||translations[currentLanguage].pendingText;
 $("wordForWord").textContent=
   (currentLanguage==="es" ? v.word_for_word_es : v.word_for_word)
   || translations[currentLanguage].noWordForWord;
 $("translation").textContent=
   (currentLanguage==="es" ? v.translation_es : v.translation)
   || translations[currentLanguage].pendingText;

 $("restoreVerse").style.display=edit ? "" : "none";
 $("verseEditor").style.display="none";
 $("editVerse").style.display="";
 let savedStatus=localStorage.getItem("status_"+rank)||"new";
 if(savedStatus==="Nuevo") savedStatus="new";
 if(savedStatus==="Aprendiendo") savedStatus="learning";
 if(savedStatus==="Memorizado") savedStatus="memorized";
 $("status").value=savedStatus;

 renderList();

 const active=document.querySelector(".verse-item.active");
 if(active) active.scrollIntoView({block:"nearest"});

 await refreshAudioStatus();
}

async function getAudioSource(){
 const personal=await getRecording(currentRank);

 if(personal)
   return {url:URL.createObjectURL(personal),kind:"personal"};

 const file=audioMap[String(currentRank)];
 if(file)
   return {url:"./builtin_audio/"+encodeURIComponent(file),kind:"incluido"};

 return null;
}

async function refreshAudioStatus(){
 const personal=await getRecording(currentRank);

 if(personal){
   $("audioStatus").textContent=translations[currentLanguage].personalAudio;
   return;
 }

 if(audioMap[String(currentRank)]){
   $("audioStatus").textContent=translations[currentLanguage].includedAudio;
   return;
 }

 $("audioStatus").textContent=
   translations[currentLanguage].noAudio;
}

async function loadAudio(){
 stopAudio();

 const src=await getAudioSource();
 if(!src)return false;

 audio.src=src.url;
 audio.playbackRate=parseFloat($("speed").value);
 audio.load();
 return true;
}

async function playCurrent(){
 memorizing=false;

 if(!await loadAudio()){
   alert(translations[currentLanguage].noAudioPlay);
   return;
 }

 try{
   await audio.play();
 }catch(e){
   alert(translations[currentLanguage].playError+e.message);
 }
}

function stopAudio(){
 audio.pause();
 audio.currentTime=0;
}

function stopEverything(){
 memorizing=false;
 stopAudio();
}

async function startRecording(){
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
   alert(translations[currentLanguage].micUnsupported);
   return;
 }

 try{
   recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
   recordingChunks=[];

   let options={};
   if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))
     options={mimeType:"audio/webm;codecs=opus"};

   mediaRecorder=new MediaRecorder(recordingStream,options);

   mediaRecorder.ondataavailable=e=>{
     if(e.data.size)recordingChunks.push(e.data);
   };

   mediaRecorder.onstop=async()=>{
     const blob=new Blob(recordingChunks,{
       type:mediaRecorder.mimeType||"audio/webm"
     });

     await saveRecording(currentRank,blob);

     if(recordingStream)
       recordingStream.getTracks().forEach(t=>t.stop());

     recordingStream=null;
     mediaRecorder=null;
     $("record").textContent=translations[currentLanguage].recordVoice;
     await refreshAudioStatus();
   };

   mediaRecorder.start();
   $("record").textContent=translations[currentLanguage].finishRecording;

 }catch(e){
   alert(translations[currentLanguage].micError+e.message);
 }
}

function toggleRecording(){
 if(mediaRecorder && mediaRecorder.state==="recording"){
   mediaRecorder.stop();
   return;
 }
 stopEverything();
 startRecording();
}

async function deleteRecording(){
 const personal=await getRecording(currentRank);

 if(!personal){
   alert(translations[currentLanguage].noPersonalRecording);
   return;
 }

 if(confirm(translations[currentLanguage].confirmDelete)){
   await removeRecording(currentRank);
   await refreshAudioStatus();
 }
}

async function memorize(){
 const src=await getAudioSource();

 if(!src){
   alert(translations[currentLanguage].recordFirst);
   return;
 }

 stopEverything();

 memorizeRemaining=Math.max(1,parseInt($("repeat").value));
 memorizePause=Math.max(0,parseFloat($("pause").value))*1000;
 memorizing=true;

 audio.src=src.url;
 audio.playbackRate=parseFloat($("speed").value);
 audio.load();

 playMemorizeIteration();
}

async function playMemorizeIteration(){
 if(!memorizing)return;

 try{
   audio.currentTime=0;
   await audio.play();
 }catch(e){
   memorizing=false;
   alert(translations[currentLanguage].playError+e.message);
 }
}

audio.addEventListener("ended",()=>{
 if(!memorizing)return;

 memorizeRemaining--;

 if(memorizeRemaining<=0){
   memorizing=false;
   return;
 }

 setTimeout(()=>{
   if(memorizing)playMemorizeIteration();
 },memorizePause);
});

$("play").onclick=playCurrent;
$("stop").onclick=stopEverything;
$("record").onclick=toggleRecording;
$("deleteRecording").onclick=deleteRecording;
$("memorize").onclick=memorize;

function editorIsOpen(){

}

let editorBaseline=null;

function editorHasUnsavedChanges(){
 if(!editorIsOpen() || !editorBaseline)return false;

 return (
   $("editSource").value.trim()!==(editorBaseline.source||"") ||
   $("editOpening").value.trim()!==(editorBaseline.opening||"") ||
   $("editOriginalUrl").value.trim()!==(editorBaseline.original_url||"") ||
   $("editVerseText").value.trim()!==(editorBaseline.verse||"") ||
   $("editWordForWordEnglish").value.trim()!==(editorBaseline.word_for_word||"") ||
   $("editWordForWordSpanish").value.trim()!==(editorBaseline.word_for_word_es||"") ||
   $("editEnglish").value.trim()!==(editorBaseline.translation||"") ||
   $("editSpanish").value.trim()!==(editorBaseline.translation_es||"")
 );
}

function editorData(){
 return {
   source:$("editSource").value.trim(),
   opening:$("editOpening").value.trim(),
   original_url:$("editOriginalUrl").value.trim(),
   verse:$("editVerseText").value.trim(),
   word_for_word:$("editWordForWordEnglish").value.trim(),
   word_for_word_es:$("editWordForWordSpanish").value.trim(),
   translation:$("editEnglish").value.trim(),
   translation_es:$("editSpanish").value.trim()
 };
}

async function effectiveVerse(v){
 const edit=await getVerseEdit(v.rank);
 return edit ? {...v,...edit} : v;
}

async function findNextWithoutSpanish(afterRank){
 const start=verses.findIndex(
   v=>Number(v.rank)===Number(afterRank)
 );

 // Primero buscamos hacia adelante.
 for(let i=start+1;i<verses.length;i++){
   const v=await effectiveVerse(verses[i]);

   if(!(v.translation_es||"").trim()){
     return verses[i].rank;
   }
 }

 // Si llegamos al final, continuamos desde el principio.
 for(let i=0;i<=start;i++){
   const v=await effectiveVerse(verses[i]);

   if(!(v.translation_es||"").trim()){
     return verses[i].rank;
   }
 }

 return null;
}

 verses.forEach(v=>{

 });

 const reviewStates={};
 verses.forEach(v=>{
   const st=getReviewState(v.rank);
   if(st) reviewStates[String(v.rank)]=st;
 });

 const backup={
   app:"Memoriza Slokas",
   type:"fullBackup",
   version:1,
   exported:new Date().toISOString(),

   progress:{
     last_rank:currentRank,
     language:currentLanguage,
     statuses
   },

   edits,
   reviewStates,

   // Reservado para futuras funciones.
   favorites:{},
   notes:{}
 };

 const blob=new Blob(
   [JSON.stringify(backup,null,2)],
   {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 const date=new Date().toISOString().slice(0,10);

 a.href=url;
 a.download="memoriza-slokas-backup-"+date+".json";

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

 alert(currentLanguage==="es"
   ? "Backup creado. Incluye progreso y correcciones. Las grabaciones de audio permanecen en este dispositivo."
   : "Backup created. It includes progress and corrections. Audio recordings remain on this device.");
};


$("importEdits").onclick=()=>{
 $("importEditsFile").value="";

};


$("importEditsFile").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;

 try{
   const data=JSON.parse(await file.text());

   /*
      Aceptamos:
      1. Nuevo backup completo.
      2. Antiguos backups de correcciones.
   */

   const isFullBackup=
     data &&
     data.app==="Memoriza Slokas" &&
     data.type==="fullBackup" &&
     data.version===1;

   const isOldEditsBackup=
     data &&
     data.app==="Memoriza Slokas" &&
     data.type==="verseEdits" &&
     data.edits &&
     typeof data.edits==="object";

   if(!isFullBackup && !isOldEditsBackup)
     throw new Error("Formato no válido");


   if(isOldEditsBackup){

     const count=Object.keys(data.edits).length;

     const msg=currentLanguage==="es"
       ? "Este es un backup antiguo con "+count+
         " correcciones. ¿Importarlas?"
       : "This is an older backup containing "+count+
         " corrections. Import them?";

     if(!confirm(msg))return;

     await importVerseEdits(data.edits);

     
 if(data && data.reviewStates){
   Object.entries(data.reviewStates).forEach(([rank,state])=>{
     if(state==="needs-fix" || state==="fixed-local") setReviewState(rank,state);
   });
 }
 updateReviewButton();
 await applyFilter();
     await selectVerse(currentRank);

     alert(currentLanguage==="es"
       ? "Correcciones restauradas correctamente."
       : "Corrections restored successfully.");

     return;
   }


   const editCount=
     data.edits && typeof data.edits==="object"
       ? Object.keys(data.edits).length
       : 0;

   const statusCount=
     data.progress &&
     data.progress.statuses &&
     typeof data.progress.statuses==="object"
       ? Object.keys(data.progress.statuses).length
       : 0;


   const msg=currentLanguage==="es"
     ? "Este backup contiene "+editCount+
       " correcciones y "+statusCount+
       " estados de estudio.\n\n¿Restaurar el backup?"
     : "This backup contains "+editCount+
       " corrections and "+statusCount+
       " study statuses.\n\nRestore this backup?";

   if(!confirm(msg))return;


   // -----------------------------------------
   // Restaurar correcciones
   // -----------------------------------------

   if(data.edits && typeof data.edits==="object")
     await importVerseEdits(data.edits);


   // -----------------------------------------
   // Restaurar estados
   // -----------------------------------------

   if(
     data.progress &&
     data.progress.statuses &&
     typeof data.progress.statuses==="object"
   ){
     for(const [rank,status] of
         Object.entries(data.progress.statuses)){

       if(
         status==="new" ||
         status==="learning" ||
         status==="memorized"
       ){
         localStorage.setItem("status_"+rank,status);
       }
     }
   }


   // -----------------------------------------
   // Restaurar idioma
   // -----------------------------------------

   if(
     data.progress &&
     (data.progress.language==="en" ||
      data.progress.language==="es")
   ){
     currentLanguage=data.progress.language;
     localStorage.setItem("language",currentLanguage);
     setLanguage(currentLanguage);
   }


   // -----------------------------------------
   // Restaurar último verso
   // -----------------------------------------

   if(data.progress){
     const savedRank=parseInt(data.progress.last_rank);

     if(verses.some(v=>v.rank===savedRank)){
       currentRank=savedRank;
       localStorage.setItem("last_rank",savedRank);
     }
   }


   await applyFilter();
   await selectVerse(currentRank);


   alert(currentLanguage==="es"
     ? "Backup restaurado correctamente. Las grabaciones de audio existentes no fueron modificadas."
     : "Backup restored successfully. Existing audio recordings were not modified.");

 }catch(err){

   console.error(err);

   alert(currentLanguage==="es"
     ? "No se pudo restaurar el backup."
     : "Could not restore the backup.");
 }
};
